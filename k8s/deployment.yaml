apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-deployment
  labels:
    app: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
        - name: bff
          image: felipesalazar24/bff:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: USERS_URL
              value: "http://ms-user-service:8081"
            - name: PETS_URL
              value: "http://ms-pet-service:8082"
            - name: ADMIN_URL
              value: "http://ms-admin-service:8085"
            - name: FRONTEND_URL
              value: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: bff-service
spec:
  type: LoadBalancer
  selector:
    app: bff
  ports:
  - name: http
    protocol: TCP
    port: 8084
    targetPort: 8084
  - name: management
    protocol: TCP
    port: 8085
    targetPort: 8085